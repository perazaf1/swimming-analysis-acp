description = "Add your description here"
readme = "README.md"
authors = [
    { name = "perazaf1", email = "pe.razafindrakoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
