[project]
name = "sports-analytics-l3"
version = "0.1.0"
description = "100m Freestyle swimming profiling and performance modelling under collinearity via SVD/PCA and Ridge regression in NumPy and SciPy."
readme = "README.md"
authors = [
    { name = "perazaf1", email = "pe.razafindrakoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
sports-analytics-l3 = "sports_analytics_l3:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
